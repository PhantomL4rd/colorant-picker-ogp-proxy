name = "colorant-picker-worker"
main = "src/index.ts"
compatibility_date = "2025-12-17"
compatibility_flags = ["nodejs_compat"]

# Pages (colorant-picker.pl4rd.com) と同一ドメインの /share/* と /og/* を Worker に向ける。
# Workers Routes は Pages のリクエストハンドラよりも先に評価されるため、Pages の
# SPA fallback (_redirects の `/*  /index.html  200`) を経由せず Worker が応答する。
routes = [
  { pattern = "colorant-picker.pl4rd.com/share/*", zone_name = "pl4rd.com" },
  { pattern = "colorant-picker.pl4rd.com/og/*", zone_name = "pl4rd.com" },
]

# OGP画像用の和文フォント(subset 済 ttf)を ArrayBuffer としてバンドル
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# 毎日UTC 0:00 (JST 9:00) にショーケースキャッシュを更新
[triggers]
crons = ["0 0 * * *"]

# colorant-picker (Pages) と同一の D1 を共有
[[d1_databases]]
binding = "DB"
database_name = "colorant-picker-showcase"
database_id = "a3886729-0e7f-4cf3-9d6d-f349a34bc9f6"

# colorant-picker (Pages) と同一の KV namespace を共有
[[kv_namespaces]]
binding = "KV"
id = "79716dd0f4714941924e98852a3975eb"
